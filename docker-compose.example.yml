services:
  quant-bot:
    build: .
    command: ["python", "-m", "quant_bot", "run", "--mode", "paper", "--input", "/app/quant/fixtures/model_dataset_smoke.csv", "--state", "/tmp/runtime_state.json", "--limit", "1"]
    environment:
      LIVE_ENABLED: "false"
      MAXIMUM_LIVE_RISK: "0"
      MAXIMUM_LIVE_NOTIONAL: "0"
    read_only: true
    tmpfs:
      - /tmp
